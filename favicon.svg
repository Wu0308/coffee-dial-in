<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Espresso Gradient matching app's primary dark elements -->
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#382A22" />
      <stop offset="100%" stop-color="#201712" />
    </linearGradient>

    <!-- Warm Golden Liquid Gradient -->
    <linearGradient id="goldDrop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="60%" stop-color="#E5A84B" />
      <stop offset="100%" stop-color="#C2781E" />
    </linearGradient>
  </defs>

  <!-- Squircle Base (iOS / Modern OS Icon) -->
  <rect width="512" height="512" rx="112" fill="url(#iconBg)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#FAF9F7" stroke-opacity="0.12" stroke-width="4" />

  <!-- Clean Minimalist V60 Pour-Over Dripper Mark -->
  <!-- Top Rim -->
  <ellipse cx="256" cy="154" rx="142" ry="25" fill="none" stroke="#FAF9F7" stroke-width="14" stroke-linecap="round" />
  
  <!-- Conical Dripper Body -->
  <path d="M114 157 L222 332 C225 336 230 340 238 340 L274 340 C282 340 287 336 290 332 L398 157" 
        fill="none" stroke="#FAF9F7" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Twin Flow Ribs framing open center negative space (去突兀分割，營造自然漏斗流線) -->
  <path d="M180 174 C198 222 224 282 242 332" fill="none" stroke="#FAF9F7" stroke-opacity="0.75" stroke-width="9" stroke-linecap="round" />
  <path d="M332 174 C314 222 288 282 270 332" fill="none" stroke="#FAF9F7" stroke-opacity="0.75" stroke-width="9" stroke-linecap="round" />

  <!-- Dripper Collar Base Plate -->
  <rect x="206" y="344" width="100" height="12" rx="6" fill="#FAF9F7" />

  <!-- Golden Extraction Droplet (The sole radiant focal point) -->
  <path d="M256 376 C256 376 239 402 239 417 C239 426.5 246.5 434 256 434 C265.5 434 273 426.5 273 417 C273 402 256 376 256 376 Z" 
        fill="url(#goldDrop)" />
  <circle cx="251.5" cy="413" r="3.2" fill="#FFFFFF" opacity="0.85" />

  <!-- Concentric Extraction Ripple -->
  <ellipse cx="256" cy="454" rx="56" ry="9" fill="none" stroke="#FCD34D" stroke-opacity="0.45" stroke-width="4" stroke-linecap="round" />
</svg>
