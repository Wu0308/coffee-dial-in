<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3D2B22" />
      <stop offset="100%" stop-color="#241711" />
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#ECE3DC" stroke-opacity="0.18" stroke-width="6" />

  <!-- Steam lines -->
  <path d="M230 110 C215 130 215 150 230 170" fill="none" stroke="#D4A373" stroke-width="12" stroke-linecap="round" opacity="0.85" />
  <path d="M275 95 C260 120 260 145 275 170" fill="none" stroke="#D4A373" stroke-width="12" stroke-linecap="round" opacity="0.85" />

  <!-- Dripper Cone (V60) -->
  <polygon points="140,185 372,185 292,305 220,305" fill="#FFFFFF" fill-opacity="0.12" stroke="#FAF7F2" stroke-width="14" stroke-linejoin="round" />
  <!-- Internal Ribs -->
  <line x1="256" y1="195" x2="256" y2="295" stroke="#FAF7F2" stroke-width="8" stroke-linecap="round" />
  <line x1="198" y1="195" x2="238" y2="295" stroke="#FAF7F2" stroke-width="7" stroke-linecap="round" opacity="0.75" />
  <line x1="314" y1="195" x2="274" y2="295" stroke="#FAF7F2" stroke-width="7" stroke-linecap="round" opacity="0.75" />

  <!-- Dripper Base Plate -->
  <rect x="130" y="305" width="252" height="18" rx="9" fill="#FAF7F2" />

  <!-- Coffee Drop -->
  <circle cx="256" cy="336" r="10" fill="#D4A373" />

  <!-- Server Body -->
  <polygon points="185,348 327,348 355,432 157,432" fill="#FFFFFF" fill-opacity="0.08" stroke="#FAF7F2" stroke-width="14" stroke-linejoin="round" />
  <!-- Coffee Liquid in Server -->
  <polygon points="172,392 340,392 350,426 162,426" fill="#D4A373" />
  <!-- Server Handle -->
  <path d="M327 356 C375 356 375 422 348 422" fill="none" stroke="#FAF7F2" stroke-width="14" stroke-linecap="round" />
</svg>
